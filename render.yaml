services:
  - type: web
    name: kartavya-pwa
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: kartavya-relay
    runtime: docker
    dockerfilePath: ./relay/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: KARTAVYA_TOKEN
        sync: false
